version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corretor-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://corretor:corretor@postgres:5432/corretor_db
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - LOG_FORMAT=json
      - TESTING=false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    networks:
      - corretor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corretor-worker
    restart: unless-stopped
    command: python -m src.workers.correction_worker
    environment:
      - WORKER_ENABLED=true
      - DATABASE_URL=postgresql+asyncpg://corretor:corretor@postgres:5432/corretor_db
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - LOG_FORMAT=json
      - TESTING=false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    networks:
      - corretor-network

  postgres:
    image: postgres:16-alpine
    container_name: corretor-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=corretor
      - POSTGRES_PASSWORD=corretor
      - POSTGRES_DB=corretor_db
      - POSTGRES_INITDB_ARGS=-c max_connections=200
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - corretor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corretor -d corretor_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: corretor-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - corretor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - dev

volumes:
  postgres_data:
    name: corretor-postgres-data
  ollama_data:
    name: corretor-ollama-data

networks:
  corretor-network:
    name: corretor-network
    driver: bridge
