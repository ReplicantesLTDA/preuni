[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corretor-redacao"
version = "0.1.0"
description = "Automated ENEM Essay Correction API (MVP)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "dwbessa", email = "dev@example.com" }
]
keywords = ["ENEM", "essay", "correction", "LLM", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]

dependencies = [
    # Core web framework
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    
    # HTTP client
    "httpx>=0.24.0",
    
    # Data validation
    "jsonschema>=4.20.0",
    
    # Logging & observability
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-exporter-otlp>=1.21.0",
    
    # Language detection
    "lingua-language-detector>=2.0.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    
    # Authentication & security
    "PyJWT>=2.8.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "import-linter>=2.0",
    "httpx[http2]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/dwbessa/redacao-enem"
Repository = "https://github.com/dwbessa/redacao-enem"
Issues = "https://github.com/dwbessa/redacao-enem/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "golden: golden dataset tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
# Constitution Principle II: coverage floor is 90%, reached incrementally
# (Principle VI: small PRs). 70 is today's *provisional* baseline, measured
# against a live Postgres (2026-08-22): 74.06%, up from 69.3% after adding
# tests/integration/workers/test_process_one.py, which exercises
# process_one() end to end (grader_pass persistence, audit writes,
# competency dict building) — previously only reached indirectly via
# correction_repo functions, never the worker orchestration itself. That
# test also caught a real bug: derive_seed() read its hash digest as an
# *unsigned* int64, overflowing grader_passes.seed (a signed Postgres
# BIGINT) for ~half of all correction ids -- fixed in single_grader.py.
# 74.13% -> 77.71% after deleting src/config/settings.py, which was fully
# dead code: a pydantic-settings tree left over from the pre-014 FastAPI
# service, never imported anywhere once the Go monolith took over identity/
# config (confirmed via grep -- zero importers). 77.71% -> 78.74% after
# testing entrypoint._build_provider(), which also caught a real bug: it
# called OllamaProvider(..., model=model, ...) but the constructor's
# keyword is model_id -- every worker process start would have crashed
# with a TypeError before processing a single job. Fixed.
# 78.74% -> 82.18% after (a) noticing local Postgres had silently exited
# mid-session -- DB-backed integration tests were skipping instead of
# running, quietly understating every number below; restarting it
# recovered ~4pp on its own -- and (b) adding unit tests for
# _llm_error_to_code/_llm_error_message_pt_br (0% before) and
# MultiPassGrader (40% before, entirely untested despite being a real
# selectable GRADER=multi_pass mode).
# 82.18% -> 85.63% after adding the same contract-test treatment to
# PerCompetencyGrader (41% before -- same shape of gap MultiPassGrader had).
# 85.63% -> 86.29% after covering observability.tracing's configure_tracing
# (33% before -- only ever exercised implicitly via api.main's disabled-
# tracing startup path).
# 86.29% -> 87.98% after covering observability.logging's context-var
# helpers/ContextVarsFilter/configure_logging (62% before, both 100% now)
# and db.session.get_session's rollback-on-exception branch (100% now).
# 87.98% -> 88.56% after covering the remaining edge branches in
# audit_log_repo, correction_repo._mark_job, schemas.load_schema, and
# observability.metrics.initialize_app_info -- all 100% now.
# 88.56% -> 89.22% after covering scripts/correct_essay.py's motivational-
# texts file read, _make_provider's ollama branch, and _typed_error's
# generic-LLMError fallback (92% now), then 89.66% after covering
# entrypoint._main by mocking CorrectionWorker.run (entrypoint.py 100% now).
# 89.66% -> 92.89% (constitution's 90% floor reached) after actually
# testing CorrectionWorker.run()'s LISTEN/NOTIFY loop: starts a real
# worker against the test DB, seeds a pending correction_jobs row, lets
# the poll backstop claim+grade it via FakeProvider, then stops the
# worker and asserts the correction reached 'completed' with the right
# score (correction_worker.py 60% -> 94%). Also covered tracing.py's
# OTLP-exporter-failure branch by mocking OTLPSpanExporter to raise
# (tracing.py 100% now).
# Remaining gap: correction_worker.py lines 237-252,306,326 -- the
# _listen_task's own exception handler when asyncpg.connect itself fails;
# would need to break the real DB connection mid-test, low value.
fail_under = 92
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*Protocol:",
]

[tool.mypy]
python_version = "3.12"
strict = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/", ".venv/"]

[[tool.mypy.overrides]]
module = "lingua"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prometheus_client"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E203",  # whitespace before ':'
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode -- pt-BR domain content legitimately uses en-dash, accents, etc.
    "B008",  # FastAPI idiom: Depends() in default argument is the standard pattern
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
section-order = ["future", "stdlib", "third-party", "first-party", "local"]

[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "Corrector layer isolation"
type = "forbidden"
source_modules = ["src.corrector"]
forbidden_modules = [
    "src.db",
    "src.api",
    "src.workers",
]

[[tool.importlinter.contracts]]
name = "No vendor names in corrector business logic"
type = "forbidden"
source_modules = ["src.corrector"]
forbidden_modules = [
    "src.corrector.llm.anthropic",
    "src.corrector.llm.openai",
    "src.corrector.llm.ollama_vendor",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''
