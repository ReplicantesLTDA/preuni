name: security-ci

# Constitution VII (Security & Secrets, NON-NEGOTIABLE): secret scanning
# and dependency vulnerability audits run on every PR, repo-wide -- not
# scoped to a single stack's changed paths, since a leaked secret or a
# vulnerable transitive dependency is a real risk regardless of which
# directory changed.

on:
  push:
    branches: [main, dev]
  pull_request: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      # Baseline-aware: only NEW findings (not the 16 pre-existing
      # test-fixture placeholder values captured in .gitleaks-baseline.json
      # at v2.3.0's ratification) fail the build. Rotate any real secret
      # if one is ever found instead of adding it to the baseline.
      - name: gitleaks (secret scanning, baseline-aware)
        run: gitleaks detect --baseline-path=.gitleaks-baseline.json --redact -v

  go-vuln-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck (backend)
        working-directory: backend/app
        run: govulncheck ./...
      - name: govulncheck (pkg)
        working-directory: backend/pkg
        run: govulncheck ./...

  python-vuln-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-corrector
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv pip install --system -e ".[dev]"
      - run: uv pip install --system pip-audit
      - name: pip-audit
        run: pip-audit

  mobile-vuln-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Blocking on critical only for now: 34 high/moderate findings are
      # transitive, deep inside Expo/Metro's own build-tooling chain
      # (postcss, svgo, tar sub-deps of @expo/cli) -- dev/build-time code,
      # not shipped in the app bundle, and not safely fixable without
      # risking breaking Expo's own dependency resolution. Tracked debt,
      # same pattern as golangci-lint/gofmt's non-blocking pre-existing
      # debt elsewhere in this repo; revisit as Expo SDK releases catch up.
      - name: pnpm audit (fail on critical)
        run: pnpm audit --audit-level=critical
