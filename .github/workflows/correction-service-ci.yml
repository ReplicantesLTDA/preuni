name: correction-service-ci

on:
  push:
    branches: [main, dev, '014-constitution-alignment-refactor', '015-cicd-pipeline']
    paths:
      - 'ai-corrector/**'
      - '.github/workflows/correction-service-ci.yml'
  pull_request:
    paths:
      - 'ai-corrector/**'
      - '.github/workflows/correction-service-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-corrector
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corretor
          POSTGRES_PASSWORD: corretor
          POSTGRES_DB: corretor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://corretor:corretor@localhost:5432/corretor_test
      DATABASE_URL: postgresql+asyncpg://corretor:corretor@localhost:5432/corretor_test
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: uv pip install --system -e ".[dev]"

      - name: ruff
        run: ruff check src tests

      - name: mypy
        run: mypy src

      - name: import-linter
        run: lint-imports

      - name: alembic upgrade head
        run: alembic upgrade head

      # Constitution VI: every migration must ship a working downgrade.
      # This proves it, not just asserts it -- downgrade every revision on
      # a clean DB, then re-upgrade so the schema is back at head for the
      # test steps below.
      - name: alembic migration round-trip (downgrade base -> upgrade head)
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: unit + integration tests with coverage gate
        # Not `-m integration` (the Makefile's test-int target uses that,
        # but no test in this suite is actually marked @pytest.mark.integration
        # -- pre-existing bug, same category as `lint-imports --root src`;
        # CI caught it: `-m integration` deselects all 102 tests, exit 5).
        # Directory-based selection covers both dirs in one run so the
        # coverage gate sees the real combined number (unit-only
        # undercounts by ~18 points -- see pyproject.toml's fail_under comment).
        run: pytest tests/unit tests/integration -v --cov=src --cov-report=term-missing

      - name: golden dataset (fake provider — every PR, plumbing only)
        env:
          GOLDEN_PROVIDER: fake
        run: pytest tests/golden -v -s
