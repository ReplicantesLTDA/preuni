name: correction-service-ci

on:
  push:
    branches: [main, dev, '014-constitution-alignment-refactor', '015-cicd-pipeline']
    paths:
      - 'corretor-redacao/**'
      - '.github/workflows/correction-service-ci.yml'
  pull_request:
    paths:
      - 'corretor-redacao/**'
      - '.github/workflows/correction-service-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corretor-redacao
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corretor
          POSTGRES_PASSWORD: corretor
          POSTGRES_DB: corretor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://corretor:corretor@localhost:5432/corretor_test
      DATABASE_URL: postgresql+asyncpg://corretor:corretor@localhost:5432/corretor_test
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: uv pip install --system -e ".[dev]"

      - name: ruff
        run: ruff check src tests

      - name: mypy (non-blocking — pre-existing debt, tracked separately from this PR's scope)
        continue-on-error: true
        run: mypy src tests

      - name: import-linter
        run: lint-imports

      - name: alembic upgrade head
        run: alembic upgrade head

      - name: unit tests with coverage gate
        run: pytest tests/unit -v --cov=src --cov-report=term-missing --cov-fail-under=45

      - name: integration tests
        # Not `-m integration` (the Makefile's test-int target uses that,
        # but no test in this suite is actually marked @pytest.mark.integration
        # -- pre-existing bug, same category as `lint-imports --root src`;
        # CI caught it: `-m integration` deselects all 102 tests, exit 5).
        # Directory-based selection is what the unit-test step already uses.
        run: pytest tests/integration -v

      - name: golden dataset (fake provider — every PR, plumbing only)
        env:
          GOLDEN_PROVIDER: fake
        run: pytest tests/golden -v -s
