# Constitution Principle VI (Engineering Workflow, NON-NEGOTIABLE):
# fast checks run here and block the commit; the full suite + coverage
# gate runs in CI (.github/workflows/*.yml) on every push.
#
# Install: pip install pre-commit && pre-commit install

repos:
  - repo: local
    hooks:
      # Constitution VII (Security & Secrets, NON-NEGOTIABLE): secrets
      # must never reach a commit. Runs repo-wide, not changed-files-only
      # — a leaked secret in any file is a real leak, not "pre-existing
      # debt" to defer.
      - id: gitleaks
        name: gitleaks (secret scanning)
        entry: gitleaks protect --staged --verbose --redact --baseline-path=.gitleaks-baseline.json
        language: system
        pass_filenames: false

      # Constitution VI: any new/touched infra/migrations/*.sql needs a
      # matching *.down.sql sibling (see check-migration-downgrades.sh's
      # own header for the full rule).
      - id: migration-downgrade-check
        name: migration downgrade check
        entry: bash backend/scripts/check-migration-downgrades.sh
        language: system
        files: ^infra/migrations/.*\.sql$
        pass_filenames: false

      # gofmt/golangci-lint are scoped to changed files only (pass_filenames
      # default) rather than the whole repo — the existing codebase has
      # repo-wide formatting drift predating this pipeline (see
      # .github/workflows/backend-ci.yml's comment); scoping to changed
      # files means a commit only has to keep the files it touches clean.
      - id: gofmt
        name: gofmt (backend, changed files)
        entry: bash -c 'out=$(gofmt -l "$@"); [ -z "$out" ] || { echo "$out"; exit 1; }' --
        language: system
        files: ^backend/.*\.go$

      # Runs repo-wide (golangci-lint doesn't cleanly support a
      # changed-files-only mode here) — expect it to also flag pre-existing
      # issues untouched by your commit until that debt is cleaned up
      # separately; treat new findings in files you touched as real.
      - id: golangci-lint
        name: golangci-lint (backend)
        entry: bash -c 'cd backend/app && golangci-lint run --timeout=5m'
        language: system
        files: ^backend/.*\.go$
        pass_filenames: false

      - id: go-test-unit
        name: go test -short (backend, fast subset)
        entry: bash -c 'cd backend/app && go test -short ./...'
        language: system
        files: ^backend/.*\.go$
        pass_filenames: false

      - id: ruff-check
        name: ruff check (ai-corrector)
        entry: bash -c 'cd ai-corrector && ruff check src tests'
        language: system
        files: ^ai-corrector/.*\.py$
        pass_filenames: false

      - id: ruff-format-check
        name: ruff format --check (ai-corrector)
        entry: bash -c 'cd ai-corrector && ruff format --check src tests'
        language: system
        files: ^ai-corrector/.*\.py$
        pass_filenames: false

      # Runs repo-wide (mypy's cache makes this cheap on repeat runs) --
      # src/ only, matching pyproject.toml's [tool.mypy] exclude = ["tests/"].
      - id: mypy
        name: mypy (ai-corrector)
        entry: bash -c 'cd ai-corrector && mypy src'
        language: system
        files: ^ai-corrector/src/.*\.py$
        pass_filenames: false

      - id: pytest-unit
        name: pytest tests/unit (ai-corrector, fast subset)
        entry: bash -c 'cd ai-corrector && pytest tests/unit -q'
        language: system
        files: ^ai-corrector/.*\.py$
        pass_filenames: false

      - id: mobile-typecheck
        name: tsc --noEmit (mobile)
        entry: bash -c 'cd mobile && pnpm typecheck'
        language: system
        files: ^mobile/.*\.tsx?$
        pass_filenames: false

      - id: mobile-eslint
        name: eslint (mobile)
        entry: bash -c 'cd mobile && pnpm lint'
        language: system
        files: ^mobile/.*\.tsx?$
        pass_filenames: false
