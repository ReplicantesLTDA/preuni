services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - preuni
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - preuni
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: on-failure

  # ── API Gateway ─────────────────────────────────────────────────────────────

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - preuni
    depends_on:
      auth:
        condition: service_started
      user:
        condition: service_started
      content:
        condition: service_started
      learning:
        condition: service_started
      simulation:
        condition: service_started
      dissertation:
        condition: service_started
      notification:
        condition: service_started
    restart: on-failure

  # ── Go Microservices ─────────────────────────────────────────────────────────

  auth:
    build:
      context: ../backend
      dockerfile: svc/auth/Dockerfile
    environment:
      PORT: "8081"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=auth&sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ACCESS_EXPIRY_SECONDS: ${JWT_ACCESS_EXPIRY_SECONDS}
      JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS}
      MAIL_SERVICE_URL: "http://mail:4000"
      USER_SERVICE_URL: "http://user:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - preuni
    restart: on-failure

  user:
    build:
      context: ../backend
      dockerfile: svc/user/Dockerfile
    environment:
      PORT: "8082"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=users&sslmode=disable"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - preuni
    restart: on-failure

  content:
    build:
      context: ../backend
      dockerfile: svc/content/Dockerfile
    environment:
      PORT: "8083"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=content&sslmode=disable"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8083:8083"
    networks:
      - preuni
    restart: on-failure

  learning:
    build:
      context: ../backend
      dockerfile: svc/learning/Dockerfile
    environment:
      PORT: "8084"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=learning&sslmode=disable"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks:
      - preuni
    restart: on-failure

  simulation:
    build:
      context: ../backend
      dockerfile: svc/simulation/Dockerfile
    environment:
      PORT: "8085"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=simulation&sslmode=disable"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8085:8085"
    networks:
      - preuni
    restart: on-failure

  dissertation:
    build:
      context: ../backend
      dockerfile: svc/dissertation/Dockerfile
    environment:
      PORT: "8086"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=dissertation&sslmode=disable"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8086:8086"
    networks:
      - preuni
    restart: on-failure

  notification:
    build:
      context: ../backend
      dockerfile: svc/notification/Dockerfile
    environment:
      PORT: "8087"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=notification&sslmode=disable"
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8087:8087"
    networks:
      - preuni
    restart: on-failure

  # ── Mail Service (Elixir) ────────────────────────────────────────────────────

  mail:
    build:
      context: ../backend/svc/mail
      dockerfile: Dockerfile
    environment:
      MIX_ENV: prod
      PORT: "4000"
      SECRET_KEY_BASE: ${MAIL_SECRET_KEY_BASE}
      INTERNAL_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SWOOSH_ADAPTER: ${SWOOSH_ADAPTER}
      FROM_EMAIL: ${FROM_EMAIL}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      PHX_HOST: ${PHX_HOST}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    ports:
      - "4000:4000"
    networks:
      - preuni
    restart: on-failure

networks:
  preuni:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
