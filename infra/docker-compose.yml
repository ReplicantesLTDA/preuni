name: preuni

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: on-failure

  # ── Object storage (avatars) ─────────────────────────────────────────────────
  # MinIO -- self-hosted, S3-compatible. minio-init runs once to create the
  # bucket and set it public-read (avatars are meant to be publicly viewable
  # once uploaded), then exits.

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-preuni-avatars}
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $$STORAGE_ACCESS_KEY $$STORAGE_SECRET_KEY &&
      mc mb -p local/$$STORAGE_BUCKET || true;
      mc anonymous set download local/$$STORAGE_BUCKET
      "
    restart: "no"

  # ── API Gateway ─────────────────────────────────────────────────────────────

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      monolith:
        condition: service_started
    restart: on-failure

  # ── Unified Backend Monolith ─────────────────────────────────────────────────
  # Single Go binary serving /v1/auth/*, /v1/students/*, /internal/students,
  # /internal/email/send. Replaces former auth + user + Elixir mail services.

  monolith:
    build:
      context: ../backend
      dockerfile: app/Dockerfile
    environment:
      MONOLITH_PORT: "8080"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ACCESS_EXPIRY_SECONDS: ${JWT_ACCESS_EXPIRY_SECONDS}
      JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-localhost:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_USE_SSL: "false"
      STORAGE_BUCKET: ${STORAGE_BUCKET:-preuni-avatars}
      APP_VERIFICATION_BASE_URL: ${APP_VERIFICATION_BASE_URL:-https://app.preuni.com.br/verify-email}
      FROM_EMAIL: ${FROM_EMAIL}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8088:8080"
    restart: on-failure

  # ── Correction Service (internal-only, no public ingress) ───────────────────
  # DB-mediated bridge only (correction.correction_jobs) -- see
  # specs/014-constitution-alignment-refactor/contracts/internal-bridge.md.
  # No host port published for either service: reachable only from other
  # containers on this compose network.

  corrector-api:
    build:
      context: ../ai-corrector
      dockerfile: Dockerfile
    environment:
      # Only used for `make migrate`'s one-off `alembic upgrade head` run
      # against this image -- the FastAPI app itself is health/metrics
      # only and never touches the database or an LLM provider.
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  corrector-worker:
    build:
      context: ../ai-corrector
      dockerfile: Dockerfile
    command: python -m src.workers.entrypoint
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      # entrypoint.py picks Ollama Cloud automatically when this is set
      # (falls back to OLLAMA_BASE_URL, a local Ollama this stack does
      # not itself run, when empty).
      OLLAMA_CLOUD_API_KEY: ${CORRECTOR_OLLAMA_CLOUD_API_KEY:-}
      OLLAMA_CLOUD_BASE_URL: ${CORRECTOR_OLLAMA_CLOUD_BASE_URL:-https://ollama.com}
      OLLAMA_BASE_URL: ${CORRECTOR_OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${CORRECTOR_OLLAMA_MODEL:-kimi-k2.6}
      PROMPT_VERSION: ${CORRECTOR_PROMPT_VERSION:-v1.0.8}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  minio_data:
