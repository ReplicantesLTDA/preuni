services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: preuni
      POSTGRES_PASSWORD: preuni
      POSTGRES_DB: preuni
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preuni"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── API Gateway ─────────────────────────────────────────────────────────────

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - user
      - content
      - learning
      - simulation
      - dissertation
      - notification

  # ── Go Microservices ─────────────────────────────────────────────────────────

  auth:
    build:
      context: ../backend/svc/auth
      dockerfile: Dockerfile
    environment:
      PORT: "8081"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://preuni:preuni@postgres:5432/preuni?search_path=auth&sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      INTERNAL_SERVICE_TOKEN: dev-shared-secret
      JWT_SIGNING_KEY: dev-jwt-signing-key-minimum-32-characters-long
      JWT_ACCESS_EXPIRY_SECONDS: "3600"
      JWT_REFRESH_EXPIRY_DAYS: "30"
      MAIL_SERVICE_URL: "http://mail:4000"
      USER_SERVICE_URL: "http://user:8082"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  user:
    build:
      context: ../backend/svc/user
      dockerfile: Dockerfile
    environment:
      PORT: "8082"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://preuni:preuni@postgres:5432/preuni?search_path=users&sslmode=disable"
      INTERNAL_SERVICE_TOKEN: dev-shared-secret
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"

  content:
    build:
      context: ../backend/svc/content
      dockerfile: Dockerfile
    environment:
      PORT: "8083"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://preuni:preuni@postgres:5432/preuni?search_path=content&sslmode=disable"
      INTERNAL_SERVICE_TOKEN: dev-shared-secret
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"

  learning:
    build:
      context: ../backend/svc/learning
      dockerfile: Dockerfile
    environment:
      PORT: "8084"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://preuni:preuni@postgres:5432/preuni?search_path=learning&sslmode=disable"
      INTERNAL_SERVICE_TOKEN: dev-shared-secret
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"

  simulation:
    build:
      context: ../backend/svc/simulation
      dockerfile: Dockerfile
    environment:
      PORT: "8085"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://preuni:preuni@postgres:5432/preuni?search_path=simulation&sslmode=disable"
      INTERNAL_SERVICE_TOKEN: dev-shared-secret
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"

  dissertation:
    build:
      context: ../backend/svc/dissertation
      dockerfile: Dockerfile
    environment:
      PORT: "8086"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://preuni:preuni@postgres:5432/preuni?search_path=dissertation&sslmode=disable"
      INTERNAL_SERVICE_TOKEN: dev-shared-secret
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      CLAUDE_MODEL: claude-haiku-4-5-20251001
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8086:8086"

  notification:
    build:
      context: ../backend/svc/notification
      dockerfile: Dockerfile
    environment:
      PORT: "8087"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://preuni:preuni@postgres:5432/preuni?search_path=notification&sslmode=disable"
      INTERNAL_SERVICE_TOKEN: dev-shared-secret
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8087:8087"

  # ── Mail Service (Elixir) ────────────────────────────────────────────────────

  mail:
    build:
      context: ../backend/svc/mail
      dockerfile: Dockerfile
    environment:
      MIX_ENV: prod
      PORT: "4000"
      SECRET_KEY_BASE: dev-secret-key-base-minimum-64-characters-long-for-phoenix
      INTERNAL_TOKEN: dev-shared-secret
      SWOOSH_ADAPTER: local
      FROM_EMAIL: noreply@preuni.com.br
    ports:
      - "4000:4000"

volumes:
  postgres_data:
  redis_data:
