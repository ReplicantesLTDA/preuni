services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - preuni
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - preuni
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: on-failure

  # ── API Gateway ─────────────────────────────────────────────────────────────

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - preuni
    depends_on:
      monolith:
        condition: service_started
    restart: on-failure

  # ── Unified Backend Monolith ─────────────────────────────────────────────────
  # Single Go binary serving /v1/auth/*, /v1/students/*, /internal/students,
  # /internal/email/send. Replaces former auth + user + Elixir mail services.

  monolith:
    build:
      context: ../backend
      dockerfile: app/Dockerfile
    environment:
      MONOLITH_PORT: "8080"
      LOG_LEVEL: debug
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ACCESS_EXPIRY_SECONDS: ${JWT_ACCESS_EXPIRY_SECONDS}
      JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS}
      S3_BUCKET: ${S3_BUCKET:-preuni-avatars}
      S3_REGION: ${S3_REGION:-us-east-1}
      FROM_EMAIL: ${FROM_EMAIL}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8088:8080"
    networks:
      - preuni
    restart: on-failure

networks:
  preuni:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
