name: preuni-prod

# Production stack for preuni, self-hosted on the user's TrueNAS SCALE NAS
# (035-self-hosted-prod-deploy). Same services as infra/docker-compose.yml
# (the dev stack) with three differences:
#   1. No host port published anywhere -- the only path in is cloudflared's
#      outbound tunnel to Cloudflare's edge, routed to `gateway` (see
#      specs/035-self-hosted-prod-deploy/tasks.md T008). CGNAT on this NAS
#      makes direct port-forwarding impossible anyway.
#   2. `postgres`'s data directory is a bind mount to a real NAS dataset
#      path (POSTGRES_DATA_PATH), not a Docker-managed volume, so a
#      NAS-level snapshot/backup job can reach it directly (FR-008).
#   3. `restart: unless-stopped` throughout, so the stack comes back on
#      its own after a NAS reboot (SC-005) -- `on-failure` (dev's policy)
#      does not guarantee that.
#
# Secrets come from infra/.env on the NAS (gitignored, never committed) --
# see infra/.env.prod.example for the required shape. Brought up via
# `docker compose -f infra/docker-compose.prod.yml up -d --build`, first
# manually (specs/035-self-hosted-prod-deploy/tasks.md T010), then
# automatically by .github/workflows/deploy-prod.yml on every push to
# `main`.

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Ingress: Cloudflare Tunnel ────────────────────────────────────────────────
  # Outbound-only connection to Cloudflare's edge -- works through CGNAT with
  # no port forwarding. Tunnel + public-hostname routing (preuni.com.br ->
  # gateway:8080) are configured in the Cloudflare dashboard (token-only
  # mode, research.md R1); this container just needs the token.

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

  # ── API Gateway ─────────────────────────────────────────────────────────────

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      monolith:
        condition: service_started
    restart: unless-stopped

  # ── Unified Backend Monolith ─────────────────────────────────────────────────

  monolith:
    build:
      context: ../backend
      dockerfile: app/Dockerfile
    environment:
      MONOLITH_PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      JWT_ACCESS_EXPIRY_SECONDS: ${JWT_ACCESS_EXPIRY_SECONDS}
      JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS}
      S3_BUCKET: ${S3_BUCKET:-preuni-avatars}
      S3_REGION: ${S3_REGION:-us-east-1}
      APP_VERIFICATION_BASE_URL: ${APP_VERIFICATION_BASE_URL:-https://preuni.com.br/verify-email}
      FROM_EMAIL: ${FROM_EMAIL}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Correction Service (internal-only, no public ingress) ───────────────────
  # Same DB-mediated bridge as dev (032-corrector-service-integration) and
  # local verification (034) -- no standalone Postgres, no JWT auth, no
  # public API. This is what actually closes #69: a real target to be
  # correct against, instead of the deleted deploy/docker-compose.prod.yml
  # that assumed it was still a standalone product.

  corrector-api:
    build:
      context: ../ai-corrector
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  corrector-worker:
    build:
      context: ../ai-corrector
      dockerfile: Dockerfile
    command: python -m src.workers.entrypoint
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      OLLAMA_CLOUD_API_KEY: ${CORRECTOR_OLLAMA_CLOUD_API_KEY:-}
      OLLAMA_CLOUD_BASE_URL: ${CORRECTOR_OLLAMA_CLOUD_BASE_URL:-https://ollama.com}
      OLLAMA_BASE_URL: ${CORRECTOR_OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${CORRECTOR_OLLAMA_MODEL:-kimi-k2.6}
      PROMPT_VERSION: ${CORRECTOR_PROMPT_VERSION:-v1.0.8}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Backup ────────────────────────────────────────────────────────────────
  # Daily pg_dump of the whole shared `preuni` database (all schemas -- see
  # research.md R4), uploaded to S3-compatible storage. Reuses ai-corrector's
  # existing backup sidecar unchanged; what it dumps is determined entirely
  # by POSTGRES_DB above, not by anything correction-specific in the script.

  backup:
    build:
      context: ../ai-corrector/deploy/backup
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
