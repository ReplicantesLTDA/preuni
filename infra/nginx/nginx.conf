worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format json_combined escape=json
        '{"ts":"$time_iso8601",'
        '"ip":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"request_id":"$http_x_request_id"}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Rate-limiting zones ───────────────────────────────────────────────────
    # auth_zone: 100 requests/minute per IP for auth endpoints
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=100r/m;
    # api_zone:  1000 requests/minute per IP for all other API endpoints
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=1000r/m;

    limit_req_status 429;

    # ── Upstream service definitions ─────────────────────────────────────────
    # Monolith serves auth + user + mail. Legacy upstreams retained for rollback.
    upstream monolith_svc   { server monolith:8080;     }
    upstream auth_svc       { server auth:8081;         }
    upstream user_svc       { server user:8082;         }
    upstream content_svc    { server content:8083;      }
    upstream learning_svc   { server learning:8084;     }
    upstream simulation_svc { server simulation:8085;   }
    upstream dissertation_svc { server dissertation:8086; }
    upstream notification_svc { server notification:8087; }

    # ── Main API server ───────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        # Add unique request ID to every request
        set $request_id_value $http_x_request_id;
        if ($request_id_value = "") {
            set $request_id_value $request_id;
        }

        # ── Auth endpoints (all /v1/auth/* routed to monolith) ────────────────
        # Includes /v1/auth/account (DELETE) which was previously not routed.
        # Rollback: change `monolith_svc` → `auth_svc` to route back to legacy auth.
        location /v1/auth/ {
            limit_req zone=auth_zone burst=20 nodelay;
            proxy_pass         http://monolith_svc;
            proxy_set_header   X-Request-ID  $request_id_value;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_set_header   Host          $host;
        }

        # ── Student / User endpoints ──────────────────────────────────────────
        # Rollback: change `monolith_svc` → `user_svc` to route back to legacy user.
        location /v1/students/ {
            limit_req zone=api_zone burst=50 nodelay;
            proxy_pass         http://monolith_svc;
            proxy_set_header   X-Request-ID  $request_id_value;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_set_header   Host          $host;
        }

        # ── Content endpoints ─────────────────────────────────────────────────
        location /v1/tracks/ {
            limit_req zone=api_zone burst=50 nodelay;
            proxy_pass         http://content_svc;
            proxy_set_header   X-Request-ID  $request_id_value;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_set_header   Host          $host;
        }

        location /v1/lessons/ {
            limit_req zone=api_zone burst=50 nodelay;
            proxy_pass         http://content_svc;
            proxy_set_header   X-Request-ID  $request_id_value;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_set_header   Host          $host;
        }

        # ── Learning / Spaced Repetition endpoints ────────────────────────────
        location /v1/learning/ {
            limit_req zone=api_zone burst=50 nodelay;
            proxy_pass         http://learning_svc;
            proxy_set_header   X-Request-ID  $request_id_value;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_set_header   Host          $host;
        }

        # ── Simulation endpoints ──────────────────────────────────────────────
        location /v1/simulations/ {
            limit_req zone=api_zone burst=30 nodelay;
            proxy_pass         http://simulation_svc;
            proxy_set_header   X-Request-ID  $request_id_value;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_set_header   Host          $host;
        }

        # ── Dissertation endpoints ────────────────────────────────────────────
        location /v1/dissertation/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass         http://dissertation_svc;
            proxy_set_header   X-Request-ID  $request_id_value;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_set_header   Host          $host;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
        }

        # ── Default 404 ───────────────────────────────────────────────────────
        location / {
            return 404 '{"error":{"code":"NOT_FOUND","message":"route not found"}}';
        }
    }
}
