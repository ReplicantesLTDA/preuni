worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format json_combined escape=json
        '{"ts":"$time_iso8601",'
        '"ip":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"request_id":"$http_x_request_id"}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Rate-limiting zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=1000r/m;
    limit_req_status 429;

    # ── Upstreams ────────────────────────────────────────────────────────────
    # Single Go monolith serves all current /v1/* and /internal/* routes.
    # Future domains (content, learning, simulation, dissertation, notification)
    # will be implemented inside the same monolith binary.
    upstream monolith_svc { server monolith:8080; }

    server {
        listen 8080;
        server_name _;

        # Forward X-Request-ID; generate one if absent.
        set $request_id_value $http_x_request_id;
        if ($request_id_value = "") {
            set $request_id_value $request_id;
        }

        location /v1/auth/ {
            limit_req zone=auth_zone burst=20 nodelay;
            proxy_pass         http://monolith_svc;
            proxy_set_header   X-Request-ID  $request_id_value;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_set_header   Host          $host;
        }

        location /v1/students/ {
            limit_req zone=api_zone burst=50 nodelay;
            proxy_pass         http://monolith_svc;
            proxy_set_header   X-Request-ID  $request_id_value;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_set_header   Host          $host;
        }

        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
        }

        location / {
            return 404 '{"error":{"code":"NOT_FOUND","message":"route not found"}}';
        }
    }
}
